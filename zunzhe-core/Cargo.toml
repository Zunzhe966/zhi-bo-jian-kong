[package]
name = "zunzhe-core"
version = "1.7.18"
edition = "2024"

[lib]
name = "zunzhe_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
libc = "0.2"
md-5 = "0.10"
fs2 = "0.4"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
# 必须显式启用 TLS：tokio-tungstenite 默认**不含任何 TLS 后端**，而 B站弹幕
# 服务器只提供 `wss://`。漏掉这一步时 `connect_async` 会直接报
# `URL error: TLS support not compiled in`——弹幕实时监听永远连不上，只能靠
# 轮询兜底。选 rustls（与 reqwest 的 rustls-tls 一致），避免引入系统 OpenSSL。
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true
