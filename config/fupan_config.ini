[视频监控]
# 视频源检查间隔（秒）。这一项是真实生效的节流值：调度器按它决定多久打一轮
# 视频源接口（B站/抖音等）。下限 60 秒，上限 24 小时，写非法值回退 900。
# 直播检测不受它影响，仍按 daemon tick 节拍跑（开播要尽快发现）。
# 实测 60 秒一轮会把 B站 412 风控打出来，900 秒是稳妥值。
检查间隔秒 = 300
