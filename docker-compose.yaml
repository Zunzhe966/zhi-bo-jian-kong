services:
  app:
    image: zunzhe-live-monitor:latest
    environment:
      - TERM=xterm-256color
    tty: true
    stdin_open: true
    build: .
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./backup_config:/app/backup_config
      - ./downloads:/app/downloads
      - ./fupan_output:/app/fupan_output
      - ./zunzhe-core.db:/app/zunzhe-core.db
    restart: always
