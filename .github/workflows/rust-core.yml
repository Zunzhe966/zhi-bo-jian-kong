name: Rust Core CI

on:
  push:
    paths:
      - 'zunzhe-core/**'
      - 'desktop/electron/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    paths:
      - 'zunzhe-core/**'
      - 'desktop/electron/**'
      - '.github/workflows/rust-core.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zunzhe-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zunzhe-core -> target
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: CLI contract smoke
        run: |
          ./target/release/zunzhe-core --help > /dev/null
          ./target/release/zunzhe-core mcp-info | grep mcp_command
        if: runner.os != 'Windows'
      - name: CLI contract smoke (Windows)
        shell: pwsh
        run: |
          .\target\release\zunzhe-core.exe --help | Out-Null
          .\target\release\zunzhe-core.exe mcp-info | Select-String mcp_command
        if: runner.os == 'Windows'
      - name: Electron Bilibili cookie loader contract
        shell: bash
        working-directory: desktop/electron
        run: node bilibili-cookie-loader.test.cjs
      - name: Electron watchdog and local notify contracts
        shell: bash
        working-directory: desktop/electron
        run: |
          node healthcheck.test.cjs
          node local-notify.test.cjs
          node --check main.cjs
      - name: Electron watchdog and local notify contracts (Windows)
        shell: pwsh
        working-directory: desktop/electron
        if: runner.os == 'Windows'
        run: |
          node healthcheck.test.cjs
          node local-notify.test.cjs
          node --check main.cjs
